name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo bench -p vx-mesh -p vx-world --bench mesh --bench world -- --sample-count 20

  legacy-compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/legacy-compare
      - run: cargo run --release
        working-directory: tools/legacy-compare

  headless-render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo run --release -- --probe
      - run: cargo run --release -- --screenshot frame.png --radius 8
      - run: cargo run --release -- --screenshot frame-flat.png --radius 8 --shading flat
      - run: cargo run --release -- bench --scenario small --repeats 3 --warmup 2 --frames 10 --resolution 320x180 --out bench-smoke.json
      - run: cargo run --release -- bench-compare bench-smoke.json bench-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: headless-frame
          path: |
            frame.png
            frame-flat.png
            bench-smoke.json

  instruction-counts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cargo install gungraun-runner --version 0.20.0 --locked
      - name: Record base-branch baseline
        if: github.event_name == 'pull_request'
        run: |
          git checkout --quiet ${{ github.event.pull_request.base.sha }}
          if [ -d crates/vx-instr ]; then
            cargo bench -p vx-instr --bench instructions -- --save-baseline=base
          fi
          git checkout --quiet ${{ github.sha }}
      - name: Instruction counts (fail on >1% Ir regression vs base)
        run: cargo bench -p vx-instr --bench instructions -- --baseline=base --callgrind-limits='ir=1%'
